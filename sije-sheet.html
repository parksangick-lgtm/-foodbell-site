<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>푸드벨 시제행사 내역서</title>
<meta name="description" content="푸드벨(박상익출장음식) 시제행사 내역서. 허락된 계정만 로그인해서 고치는 내부용 화면입니다.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<meta name="theme-color" content="#6E1E2B">
<!-- 휴대폰이 다크모드여도 브라우저가 색을 반전하지 않도록 ("light" 만으로는 안 막힌다) -->
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest-sije-list.webmanifest">
<link rel="apple-touch-icon" href="icons/app-sijelist-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시제행사 목록">
<!-- 글꼴은 화면을 막지 않게 받는다 — 신호가 약해 글꼴이 안 와도 화면 · 스크립트는 돈다 (그동안 맑은 고딕 등) -->
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/sije-sheet.css?v=1">
<style>
@media (prefers-color-scheme: dark){ :root{ color-scheme: only light; } }
:root{
  color-scheme: only light;
  /* 거래명세서(statement.html)와 같은 값 */
  --cream:#F7F2E9; --paper:#FFFDF8; --band2:#EDE4D3;
  --ink:#120C06; --ink-soft:#1A1409; --ink-mute:#332A1A;
  --seal:#6E1E2B; --seal-dark:#4E141E;
  --line:#E2D6BF; --line-strong:#CBBB9C;
  --sans:'Pretendard','Pretendard Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --w-normal:400; --w-medium:600; --w-bold:700;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--cream); color:var(--ink); font-family:var(--sans); font-weight:var(--w-normal);
  font-size:17px; line-height:1.6; padding:28px 16px 64px}
[hidden]{display:none !important}
.wrap{max-width:960px; margin:0 auto}
.head{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px}
.head h1{margin:0; font-size:23px; font-weight:var(--w-bold); color:var(--seal)}
.save-state{margin:0; font-size:14px; font-weight:var(--w-medium); color:var(--ink-mute)}
.save-state.off{color:var(--seal)}
.card{background:var(--paper); border:1px solid var(--line); padding:24px; max-width:480px}
.card p{margin:0 0 16px}
.note{max-width:none; margin:0 0 16px; color:var(--seal); font-weight:var(--w-medium)}
button{font-family:var(--sans); font-size:15px; font-weight:var(--w-medium); color:var(--ink-soft); min-height:44px;
  padding:6px 14px; background:var(--paper); border:1px solid var(--line-strong); cursor:pointer}
button:hover{background:var(--band2)}
button.primary, button[aria-pressed="true"]{background:var(--seal); border-color:var(--seal); color:var(--paper)}
.toolbar{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px}
.toolbar .sep{flex:1}

/* 빠른 고치기 — 날짜 · 시간은 PC 도, 품목 수량은 휴대폰에서만 */
#quick{background:var(--paper); border:1px solid var(--line); padding:12px 16px; margin-bottom:16px}
.q-when{display:flex; flex-wrap:wrap; gap:12px}
.q-field{display:flex; flex-direction:column; gap:4px; min-width:0; font-size:15px; font-weight:var(--w-medium); color:var(--ink-mute)}
.q-input{width:100%; min-width:0; font-family:var(--sans); font-size:17px; min-height:44px; padding:6px 10px; color:var(--ink);
  background:#FFFFFF; border:1px solid var(--line-strong)}
.q-head, .q-items{display:none}

.sheet-scroll{overflow-x:auto; padding-bottom:8px}
/* 3단계 서류 잇기 — 서류 아래 '이 내역서로 거래명세서 만들기' (서류 5종의 css/docs.css .doc-make 와 같은 모양) */
.doc-make{margin:28px 0 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end}
.doc-make b{font-size:15px; font-weight:var(--w-medium); color:var(--ink-mute)}
.doc-make button{font-size:15px; min-height:44px; color:var(--seal); border-color:var(--seal)}
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:60; max-width:88vw;
  background:var(--ink); color:var(--paper); font-size:15px; padding:12px 16px; border-radius:8px}

@media (max-width:699px){
  body{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
  .toolbar{position:fixed; left:0; right:0; bottom:0; z-index:40; margin:0; display:grid;
    grid-template-columns:repeat(3, 1fr); gap:6px; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:var(--paper); border-top:1px solid var(--line-strong)}
  .toolbar .sep{display:none}
  .toolbar button{padding:6px 4px; word-break:keep-all}
  .q-when .q-field{flex:1 1 140px}
  .q-head{display:block; margin:16px 0 8px; font-size:15px; font-weight:var(--w-bold); color:var(--seal)}
  .q-items{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px 12px}
  .toast{bottom:calc(130px + env(safe-area-inset-bottom))}
}

/* 인쇄: 내역서 한 장만, 미리 잰 배율로 (js/sije/sheet-page.js 의 measurePrint) */
@media print{
  body{padding:0; background:#FFFFFF}
  .no-print{display:none !important}
  .wrap{max-width:none}
  .sheet-scroll{overflow:visible; padding:0}
  #sheet{zoom:var(--print-zoom, 0.787)}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="head no-print">
    <h1>시제행사 내역서</h1>
    <p class="save-state" id="save-state" role="status"></p>
  </header>

  <p id="loading" class="no-print">불러오는 중…</p>

  <section id="login" class="card no-print" hidden>
    <p>허락된 구글 계정으로 로그인하세요.</p>
    <button type="button" id="sign-in" class="primary">구글로 로그인</button>
  </section>

  <p id="message" class="card no-print" hidden></p>

  <section id="doc" hidden>
    <div class="toolbar no-print" role="toolbar" aria-label="내역서 도구">
      <button type="button" data-set-status="확정" aria-pressed="false">확정</button>
      <button type="button" data-set-status="미확정" aria-pressed="false">미확정</button>
      <button type="button" data-set-status="주문없음" aria-pressed="false">주문없음</button>
      <span class="sep"></span>
      <button type="button" id="attach">그림 붙이기</button>
      <button type="button" id="print">인쇄</button>
      <button type="button" onclick="location.href='sije-list.html'">목록</button>
    </div>
    <input type="file" id="image-file" accept="image/*" hidden>
    <p id="overflow-note" class="card note no-print" role="alert" hidden>A4 한 장을 넘습니다 — 꼭 지킬 것 · 메모를 줄여 주세요. (이대로는 휴대폰용 PDF 가 만들어지지 않습니다)</p>
    <div id="quick" class="no-print"></div>
    <div class="sheet-scroll"><div id="sheet"></div></div>
    <!-- 3단계 서류 잇기 — 이 내역서의 고객 · 행사일 · 상차림 · 금액으로 새 거래명세서 -->
    <div class="doc-make no-print"><b>이 내역서로</b><button type="button" id="make-statement">거래명세서 만들기</button></div>
  </section>
</main>
<div id="toast" class="toast no-print" role="status" hidden></div>

<script>
// 인터넷이 없어도 한 번 열어 본 목록 · 내역서가 열리게 (sw.js)
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
<script type="module" src="js/sije/sheet-page.js?v=3"></script>
</body>
</html>
