<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6E1E2B">
<!-- 휴대폰이 다크모드여도 브라우저가 색을 반전하지 않도록 -->
<meta name="color-scheme" content="only light">
<title>푸드벨 일정</title>
<!-- 직원용 고정 링크 (사장님 2026-10-21, 설계서 docs/superpowers/specs/2026-10-21-staff-today-link-design.md).
     단톡방 공지에 한 번 올린 today.html#암호 — 열 때마다 직원 게시판(share/암호)의 지금 일정표를 카드로 보여 준다.
     사장님이 일정표를 고치면(daily-schedule.html 이 저장할 때 올림) 열어 둔 화면도 새로고침 없이 바뀐다.
     암호는 # 뒤에만 있어 사이트 서버 · 카톡 미리보기로 가지 않는다. 로그인 없음(직원은 구글 계정이 없다).
     산속 약한 신호에서도 바로 뜨게 글꼴은 기다리지 않는다(곱은바탕은 받아지면 바뀐다) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--cream:#F7F2E9; --white:#FFFFFF; --ink:#120C06; --ink-mute:#6B5E48; --primary:#6E1E2B; --gold:#B08D57; --border:#E2D6BF; --band:#F1EADB}
*{box-sizing:border-box}
body{margin:0; background:var(--cream); color:var(--ink); font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif; line-height:1.6; font-size:17px}
main{max-width:560px; margin:0 auto; padding:24px 16px 48px}
h1{font-family:'Gowun Batang',serif; font-weight:700; font-size:22px; line-height:1.4; margin:0}
h1::after{content:''; display:block; width:44px; height:2px; background:var(--gold); margin-top:12px}
#offline{margin:14px 0 0; padding:8px 12px; background:var(--band); border-left:3px solid var(--primary); font-size:15px}
#status{color:var(--ink-mute); font-size:15px; margin:16px 0}
#days{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 4px}
button.day-btn{min-height:44px; padding:8px 14px; font:inherit; font-size:15px; font-weight:600; color:var(--ink); background:var(--white); border:1px solid var(--border); border-radius:8px; cursor:pointer}
button.day-btn[aria-pressed="true"]{background:var(--primary); border-color:var(--primary); color:#fff}
.dayhead{font-family:'Gowun Batang',serif; font-weight:700; font-size:20px; margin:14px 0 6px}
.lunar{font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif; font-size:14px; font-weight:500; color:var(--ink-mute); margin-left:8px; white-space:nowrap}
.note{margin:8px 0; padding:8px 12px; background:var(--band); border-left:3px solid var(--gold); font-size:15px; overflow-wrap:anywhere}
#cards{display:grid; gap:12px; margin-top:12px}
article.card{background:var(--white); border:1px solid var(--border); border-radius:10px; padding:12px 14px}
.card .head{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; margin:0}
.card .no{font-weight:700; color:var(--primary)}
.card .time{font-weight:700}
.card .line{display:flex; align-items:center; gap:10px; margin:8px 0 0; min-width:0}
.card .lab{flex:none; width:3.2em; font-size:14px; color:var(--ink-mute)}
.card .txt{flex:1; min-width:0; word-break:keep-all; overflow-wrap:anywhere}
.card .memo{white-space:pre-line}
a.btn-call, a.btn-map{flex:none; display:inline-flex; align-items:center; min-height:40px; padding:6px 14px; border-radius:8px; font-weight:600; text-decoration:none; white-space:nowrap}
a.btn-call{background:var(--primary); color:#fff}
a.btn-map{background:var(--white); color:var(--primary); border:1px solid var(--primary)}
</style>
</head>
<body>
<main>
  <h1 id="title">푸드벨 일정</h1>
  <p id="offline" hidden>연결 안 됨 — 마지막으로 받은 내용입니다</p>
  <p id="status">불러오는 중…</p>
  <nav id="days" aria-label="날짜"></nav>
  <section id="sheet" hidden>
    <h2 class="dayhead"><span id="day-label"></span><span class="lunar" id="day-lunar"></span></h2>
    <p class="note" id="day-order" hidden></p>
    <p class="note" id="day-memo" hidden></p>
    <div id="cards"></div>
  </section>
</main>
<script type="module">
import { watchShare } from './js/sije/share-store.js';

const CHANGED = '링크가 바뀌었습니다. 단톡방 공지의 새 링크를 눌러 주세요.';
const EMPTY = '올라온 일정이 없습니다. 단톡방의 일정표 사진을 확인해 주세요.';
const WEEK = '일월화수목금토';
const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
};
const pad2 = (n) => (n < 10 ? '0' : '') + n;
const iso = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

/* 숫자만 쓴 번호 → 작대기 넣은 꼴, 전화번호 모양이 아니면 null (daily-schedule.html · call.html 의 telShape 와 같다) */
function telShape(d) {
  const m = d.match(/^(02|0\d{2})(\d{3,4})(\d{4})$/) || d.match(/^(1[5-9]\d{2})(\d{4})$/);
  return m ? m.slice(1).join('-') : null;
}
const NUM = /\d[\d-]{6,}\d/g;
const trimSep = (s) => s.replace(/^[\s,·/]+|[\s,·/]+$/g, '');

function status(text) {
  $('status').textContent = text;
  $('status').hidden = !text;
}
function note(id, text) {
  $(id).textContent = text;
  $(id).hidden = !text;
}
function link(cls, href, text) {
  const a = el('a', cls, text);
  a.href = href;
  return a;
}
function line(card, lab, text, btn) {
  const p = el('p', 'line');
  const t = el('span', 'txt', text);
  p.append(el('span', 'lab', lab), t);
  if (btn) p.append(btn);
  card.append(p);
  return t;
}
/* 칸 글자를 전화번호마다 한 줄로 — 번호 앞 글자(이름 등)는 그 줄에, 번호가 없으면 글자만 한 줄. 전화번호 모양이 아닌 숫자는 버튼이 없다 */
function phoneLines(card, lab, head, text) {
  const found = [...text.matchAll(NUM)].filter((m) => telShape(m[0].replace(/-/g, '')));
  if (!found.length) {
    const t = [head, text].filter(Boolean).join(' ');
    if (t) line(card, lab, t);
    return;
  }
  let last = 0;
  found.forEach((m, i) => {
    const before = trimSep(text.slice(last, m.index));
    last = m.index + m[0].length;
    const after = i === found.length - 1 ? trimSep(text.slice(last)) : '';
    const t = [i === 0 ? head : '', before, m[0], after].filter(Boolean).join(' ');
    line(card, lab, t, link('btn-call', 'tel:' + m[0].replace(/-/g, ''), '전화'));
  });
}

/* 일 하나 = 카드 한 장 (사진의 줄 번호 그대로). 빈 칸은 이름표까지 숨긴다 */
function card(r) {
  const c = el('article', 'card');
  const head = el('p', 'head');
  head.append(el('span', 'no', `${r.no}번`));
  if (r.time) head.append(el('span', 'time', r.time));
  const crew = [r.staff, r.car].filter(Boolean).join(' · ');
  if (crew) head.append(el('span', 'crew', crew));
  c.append(head);
  if (r.place) line(c, '장소', r.place, link('btn-map', 'https://map.naver.com/p/search/' + encodeURIComponent(r.place), '지도'));
  phoneLines(c, '연락처', '', r.tel || '');
  if (r.work) line(c, '행사', r.work);
  if (r.amt) line(c, '금액', r.amt);
  phoneLines(c, '팀장', r.lead || '', r.leadTel || '');
  phoneLines(c, '안내', '', r.guideTel || '');
  const rite = [r.hall, r.depart && `발인 ${r.depart}`, r.cremate && `화장 ${r.cremate}`].filter(Boolean).join(' · ');
  if (rite) line(c, '장례', rite);
  if (r.memo) line(c, '메모', r.memo).classList.add('memo');
  return c;
}

function dayName(date, today, tomorrow) {
  const [y, m, d] = date.split('-').map(Number);
  const md = `${m}월 ${d}일 (${WEEK[new Date(y, m - 1, d).getDay()]})`;
  return date === today ? `오늘 ${md}` : date === tomorrow ? `내일 ${md}` : md;
}

let entries = {};
let picked = null;   // 고른 일정표 id — 사장님이 고쳐 다시 그려도 그대로
const edited = (e) => (typeof e.at?.toMillis === 'function' ? e.at.toMillis() : 0);
function render() {
  const now = new Date();
  const today = iso(now);
  now.setDate(now.getDate() + 1);
  const tomorrow = iso(now);
  // 오늘 이후 · 일이 적힌 일정표만, 날짜 순 — 같은 날이면 가장 최근에 고친 것이 앞 (빈 일정표가 먼저 골라졌다, 10-21 저녁)
  const list = Object.entries(entries)
    .filter(([, e]) => typeof e?.date === 'string' && e.date >= today && e.rows?.length)
    .sort(([, a], [, b]) => a.date.localeCompare(b.date) || edited(b) - edited(a));
  $('sheet').hidden = !list.length;
  if (!list.length) {
    $('days').replaceChildren();
    return status(EMPTY);
  }
  status('');
  if (!list.some(([id]) => id === picked)) picked = (list.find(([, e]) => e.date === today) || list[0])[0];
  $('days').replaceChildren(...list.map(([id, e]) => {
    const b = el('button', 'day-btn', dayName(e.date, today, tomorrow));
    b.type = 'button';
    b.setAttribute('aria-pressed', String(id === picked));
    b.addEventListener('click', () => { picked = id; render(); });
    return b;
  }));
  const e = entries[picked];
  $('day-label').textContent = e.label || e.date;
  $('day-lunar').textContent = e.lunar || '';
  note('day-order', e.order ? `순번: ${e.order}` : '');
  note('day-memo', e.memo ? `전달 메모: ${e.memo}` : '');
  $('cards').replaceChildren(...(e.rows || []).map(card));
}

function gone() {
  entries = {};
  $('days').replaceChildren();
  $('sheet').hidden = true;
  status(CHANGED);
}

/* 기기에 남은 것만 보이는 상태가 2초 넘으면 '연결 안 됨' — 처음 열 때 잠깐 기기 것이 먼저 오는 것은 알리지 않는다 */
let cacheSince = null;
let offTimer = null;
function offline(fromCache) {
  clearTimeout(offTimer);
  if (!fromCache) {
    cacheSince = null;
    $('offline').hidden = true;
    return;
  }
  cacheSince ??= Date.now();
  offTimer = setTimeout(() => { $('offline').hidden = false; }, Math.max(0, 2000 - (Date.now() - cacheSince)));
}

const key = location.hash.slice(1);
if (!/^[\w-]{8,64}$/.test(key)) gone();
else {
  watchShare(key, (got, meta) => {
    offline(meta.fromCache);
    if (got === null) {
      if (!meta.fromCache) gone();    // 기기에 없을 뿐이면 서버 답을 기다린다
      return;
    }
    entries = got;
    render();
  }, gone);
}
</script>
<script>
// 한 번 열어 본 화면은 인터넷이 없어도 열리게 (sw.js)
if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
</body>
</html>
