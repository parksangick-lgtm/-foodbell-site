<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>푸드벨 일일 일정표</title>
<meta name="description" content="푸드벨(박상익출장음식) 일일 일정표. 다음 날 일을 줄마다 적어 직원 단톡방에 사진으로 보내는 내부용 서류입니다.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓</text></svg>">
<meta name="theme-color" content="#6E1E2B">
<!-- 휴대폰이 다크모드여도 브라우저가 색을 반전하지 않도록 ("light" 만으로는 안 막힌다) -->
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest-daily.webmanifest">
<link rel="apple-touch-icon" href="icons/app-daily-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 글꼴 · 사진 만들기 부품은 화면을 막지 않게 받는다 — 신호가 약해 안 와도 화면 · 스크립트는 돈다 (2단계 검토 I1, 1단계 sije-list 와 같음) -->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" media="print" onload="this.media='all'">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" async></script>
<style>
@media (prefers-color-scheme: dark){ :root{ color-scheme: only light; } }
:root{
  color-scheme: only light;

  /* 견적서(sije-quote.html)와 같은 값 */
  --cream:#F7F2E9; --paper:#FFFDF8; --band:#F1EADB; --band2:#EDE4D3;
  --ink:#120C06; --ink-soft:#1A1409; --ink-mute:#332A1A;
  --seal:#6E1E2B; --seal-light:#8A2836; --seal-dark:#4E141E;
  --gold:#B08D57; --gold-deep:#5C4519;
  --line:#E2D6BF; --line-strong:#CBBB9C;

  --serif:'Gowun Batang','Nanum Myeongjo',serif;
  --sans:'Pretendard','Pretendard Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;

  --w-normal:500; --w-medium:600; --w-bold:700;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--cream); color:var(--ink);
  font-family:var(--sans); font-weight:var(--w-normal); line-height:1.8;
  font-size:17px;
  text-rendering:optimizeLegibility;
  padding:28px 16px 96px;
}
@media (min-width:700px){ body{padding:44px 24px 64px} }

/* ---------- 문서면 ---------- */
.sheet{
  max-width:880px; margin:0 auto; background:var(--paper);
  border:1px solid var(--line); border-top:3px solid var(--seal);
  box-shadow:0 1px 2px rgba(20,12,6,.05), 0 18px 44px -20px rgba(20,12,6,.28);
  padding:clamp(26px,5vw,58px);
}

/* ---------- 표제 ---------- */
.masthead{display:flex; flex-wrap:wrap; gap:24px; justify-content:space-between; align-items:flex-start}
.brand{display:flex; flex-direction:column; gap:6px}
.brand-name{font-family:var(--serif); font-weight:var(--w-bold); font-size:32px; letter-spacing:.04em; color:var(--seal); line-height:1.2; margin:0}
.brand-tag{font-size:15px; font-weight:var(--w-medium); color:var(--ink-mute); letter-spacing:.02em}
.brand-tel{font-family:var(--serif); font-weight:var(--w-bold); font-size:19px; color:var(--seal); letter-spacing:.02em; text-decoration:none; font-variant-numeric:tabular-nums}
.doc-meta{display:flex; align-items:flex-start; gap:18px}
.doc-title{font-family:var(--serif); font-weight:var(--w-bold); font-size:24px; letter-spacing:.3em; color:var(--ink); margin:0 0 10px; text-indent:.3em}
.meta-list{display:grid; grid-template-columns:auto auto; gap:3px 12px; font-size:14.5px; line-height:1.6; margin:0}
.meta-list dt{color:var(--ink-mute); font-weight:var(--w-medium); letter-spacing:.04em}
.meta-list dd{margin:0; font-variant-numeric:tabular-nums; color:var(--ink)}
.seal{flex:none; width:64px; height:64px; transform:rotate(-4deg)}
.rule-double{border:0; height:4px; border-top:2px solid var(--seal); border-bottom:1px solid var(--line-strong); margin:22px 0 30px}

/* ---------- 섹션 제목 ---------- */
.sec-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; margin:0 0 14px}
.sec-head h2{font-family:var(--serif); font-weight:var(--w-bold); font-size:19px; color:var(--ink); margin:0; letter-spacing:.02em; white-space:nowrap}
.sec-head .hanja{font-size:13.5px; font-weight:var(--w-medium); color:var(--gold-deep); letter-spacing:.14em; font-family:var(--serif); white-space:nowrap}
.sec-head::after{content:""; flex:1; height:2px; background:linear-gradient(90deg, var(--gold) 0 40px, var(--line-strong) 40px)}
section + section{margin-top:34px}

/* ---------- 공급받는 자 / 공급자 ---------- */
.parties{display:grid; gap:16px; align-items:start}
@media (min-width:640px){ .parties{grid-template-columns:1fr 1fr} }
.party{border:1px solid var(--line-strong); background:var(--paper)}
.party h3{
  margin:0; padding:8px 12px; background:var(--band2); border-bottom:1px solid var(--line-strong);
  font-family:var(--serif); font-weight:var(--w-bold); font-size:15px; color:var(--ink);
  letter-spacing:.3em; text-indent:.3em; text-align:center;
}
.party dl{margin:0}
.prow{display:grid; grid-template-columns:86px 1fr; border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow dt{padding:8px 12px; background:var(--band); font-size:14px; font-weight:var(--w-medium); color:var(--ink-soft); letter-spacing:.04em; border-right:1px solid var(--line); display:flex; align-items:center}
.prow dd{margin:0; padding:8px 12px; font-size:15.5px; color:var(--ink); display:flex; align-items:center; flex-wrap:wrap; gap:4px; min-height:42px}
.prow .regno{font-weight:var(--w-bold); font-variant-numeric:tabular-nums; letter-spacing:.02em}
.prow .honor{color:var(--ink-mute); font-size:14.5px}
body.editing .prow dd > span[data-edit]{flex:1}   /* 편집할 때 입력 칸을 줄 끝까지 넓게 */
/* 도장 — (인) 위에 겹쳐 찍는다. html2canvas 가 퍼센트 translate 를 잘못 옮겨서 margin 으로 가운데를 잡는다 */
.in{position:relative; display:inline-block; margin-left:auto; margin-right:12px; color:var(--ink-mute); font-size:14.5px}
.stamp{position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; transform:rotate(-3deg); pointer-events:none}

/* ---------- 거래 내역 표 ---------- */
.qwrap{border:1px solid var(--line-strong)}
table.stmt{width:100%; border-collapse:collapse; font-size:15px}
table.stmt thead th{
  background:var(--band2); font-family:var(--serif); font-weight:var(--w-bold); font-size:14px;
  color:var(--ink); letter-spacing:.04em; padding:9px 8px; text-align:center;
  border-bottom:1px solid var(--line-strong); white-space:nowrap;
}
table.stmt td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top}
table.stmt td.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
table.stmt td.c{text-align:center}
table.stmt td.item-name{font-weight:var(--w-medium)}
tr.addrow td{padding:6px 8px; background:rgba(176,141,87,.06)}
tr.addrow .btn-mini{width:100%}

/* ---------- 합계 ---------- */
.totals{display:flex; margin-top:22px}
.sum{min-width:300px; width:min(380px, 100%); margin-left:auto}
.sum-row{display:flex; justify-content:space-between; gap:16px; padding:8px 0; font-size:15.5px; font-weight:var(--w-medium); color:var(--ink-soft); border-bottom:1px solid var(--line)}
.sum-row .v{font-variant-numeric:tabular-nums; color:var(--ink)}
.sum-total{
  display:flex; justify-content:space-between; align-items:baseline; gap:16px;
  margin-top:12px; padding:13px 16px; background:var(--seal); color:var(--paper);
}
.sum-total .lab{font-family:var(--serif); font-weight:var(--w-bold); font-size:16px; letter-spacing:.16em}
.sum-total .val{font-family:var(--serif); font-weight:var(--w-bold); font-size:25px; font-variant-numeric:tabular-nums}
/* 큰 금액: 이름(합계금액)은 쪼개지 않고, 금액·원은 한 덩어리 — 자리가 모자라면 금액이 다음 줄 오른쪽으로 내려간다 */
.sum-total{flex-wrap:wrap; row-gap:2px}
.sum-total .lab{white-space:nowrap}
.sum-total .val{margin-left:auto; white-space:nowrap}
@media (max-width:420px){ .sum-total{padding-left:13px; padding-right:13px} .sum-total .lab{letter-spacing:.1em} .sum-total .val{font-size:23px} }
.sum-total .val em{font-style:normal; font-size:16px; font-weight:var(--w-medium); margin-left:3px}
.sum-total .val:has([data-k="total"]:empty) em{display:none}
.sum-hangul{margin:9px 0 0; font-family:var(--serif); font-size:15.5px; font-weight:var(--w-bold); color:var(--ink); text-align:right}
.sum-note{margin:4px 0 0; font-size:13.5px; font-weight:var(--w-medium); color:var(--ink-mute); text-align:right}

/* ---------- 인수자 ---------- */
.receiver{display:flex; justify-content:flex-end; align-items:baseline; gap:10px; margin-top:34px; font-size:15.5px; font-weight:var(--w-medium); color:var(--ink-soft)}
.receiver .line{display:inline-block; width:150px; border-bottom:1px solid var(--ink-soft)}

/* ---------- 편집 표시 ---------- */
[data-edit]{outline:none}
body.editing [data-edit]{background:rgba(176,141,87,.16); box-shadow:inset 0 -1px 0 0 var(--gold-deep); cursor:text}
body.editing [data-edit]:focus{box-shadow:inset 0 -2px 0 0 var(--seal)}
body.editing [data-edit]:empty{display:inline-block; min-width:2.6em}
body.editing td[data-edit]:empty::after,
body.editing span[data-edit]:empty::after{content:"입력"; color:var(--ink-mute); font-size:.85em; font-weight:var(--w-normal)}
:focus-visible{outline:2px solid var(--seal); outline-offset:2px}

.rowctl{display:inline-flex; flex-wrap:wrap; gap:4px; margin-left:6px; vertical-align:middle}
.btn-mini{
  font-family:var(--sans); font-size:13.5px; font-weight:var(--w-medium); line-height:1; cursor:pointer;
  border:1px solid var(--line-strong); background:var(--paper); color:var(--ink-soft);
  border-radius:3px; padding:6px 8px; white-space:nowrap;
}
.btn-mini:hover{border-color:var(--seal); color:var(--seal); background:#fff}
.btn-del{color:var(--seal-dark); border-color:rgba(110,30,43,.35)}
.btn-del:hover{background:var(--seal); color:var(--paper); border-color:var(--seal)}
.btn-state[aria-pressed="true"]{background:var(--seal); color:var(--paper); border-color:var(--seal)}   /* 연기 · 취소 켜짐 (사장님 10-24 저녁) */
body:not(.editing) .rowctl,
body:not(.editing) tr.addrow{display:none !important}

/* ---------- 도구막대 ---------- */
.toolbar{
  position:fixed; top:14px; right:14px; z-index:40; display:flex; gap:4px;
  background:var(--paper); border:1px solid var(--line-strong); padding:6px;
  box-shadow:0 6px 20px -10px rgba(20,12,6,.4);
}
.toolbar button{
  font-family:var(--sans); font-size:13.5px; font-weight:var(--w-medium); color:var(--ink-soft);
  background:transparent; border:1px solid transparent; padding:6px 11px; cursor:pointer;
}
.toolbar button:hover{background:var(--band2); color:var(--ink)}
.toolbar button[aria-pressed="true"]{background:var(--seal); color:var(--paper)}
.toolbar button.primary{background:var(--seal); color:var(--paper); border-color:var(--seal); font-weight:var(--w-bold)}
.toolbar button.primary:hover{background:var(--seal-dark); color:var(--paper)}
.toolbar button[disabled]{opacity:.55; cursor:default}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  z-index:60; max-width:88vw;
  background:var(--ink); color:var(--paper); font-size:14px; line-height:1.5;
  padding:11px 16px; border-radius:8px; box-shadow:0 10px 30px -8px rgba(0,0,0,.4);
}
@media (max-width:699px){ .toast{bottom:calc(120px + env(safe-area-inset-bottom))} }
/* 문자 붙여넣기 창 */
.paste-dlg{width:min(560px, calc(100vw - 32px)); border:1px solid var(--line-strong); border-top:3px solid var(--seal); background:var(--paper); color:var(--ink); padding:16px}
.paste-dlg::backdrop{background:rgba(18,12,6,.45)}
.paste-dlg p{margin:0 0 10px; font-size:15px; line-height:1.6}
.paste-dlg textarea{width:100%; font:inherit; font-size:16px; line-height:1.5; padding:10px; border:1px solid var(--line-strong); background:#fff; color:var(--ink); resize:vertical}
.paste-btns{display:flex; justify-content:flex-end; gap:8px; margin-top:10px}
.paste-btns button{min-height:44px; min-width:88px; font:inherit; font-size:15px; font-weight:var(--w-medium); border:1px solid var(--line-strong); background:var(--paper); color:var(--ink-soft); cursor:pointer}
.paste-btns button.primary{background:var(--seal); border-color:var(--seal); color:var(--paper)}

/* ---------- 휴대폰: 도구 버튼은 화면 아래 고정, 편집 칸은 손가락 크기 ----------
   사장님이 쓰는 화면이라 아래 전화·문자 막대 대신 도구 버튼을 둔다 (2026-10-01 사용자 결정).
   위에 고정하면 안내문 첫 줄을 가리고, 좁은 칸에서 버튼 글자가 쪼개졌다. */
@media (max-width:699px){
  body{padding-bottom:calc(128px + env(safe-area-inset-bottom))}
  .toolbar{
    top:auto; right:0; bottom:0; left:0;
    display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    border:0; border-top:1px solid var(--line-strong);
    box-shadow:0 -6px 20px -12px rgba(20,12,6,.45);
  }
  .toolbar button{min-height:44px; font-size:14px; line-height:1.25; word-break:keep-all; padding:6px 4px; border:1px solid var(--line-strong)}
  body.editing [data-edit]{min-height:44px}
  body.editing span[data-edit], body.editing .meta-list dd{display:inline-flex; align-items:center; min-width:44px}
  .btn-mini{min-height:44px; min-width:44px}
  .doc-meta{gap:10px}
  .meta-list{column-gap:8px}
  .meta-list dt, .meta-list dd{white-space:nowrap}
}
@media (max-width:359px){ .seal{width:48px; height:48px} }   /* 아주 좁은 폰: 문서번호 자리를 만든다 */

/* ---------- 좁은 화면: 표를 줄마다 카드로 ---------- */
@media (max-width:620px){
  table.stmt thead{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
  table.stmt, table.stmt tbody{display:block}
  /* 한 줄 = 카드: 품목 / 월일·규격·수량 / 단가·공급가액·세액 / 비고 */
  table.stmt tr.item{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; padding:12px; border-bottom:1px solid var(--line)}
  table.stmt tr.item td{border:0; padding:0; text-align:left; white-space:normal; min-width:0}
  table.stmt tr.item td.n{white-space:nowrap}
  table.stmt tr.item td::before{content:attr(data-label); display:block; font-size:14px; font-weight:var(--w-medium); color:var(--ink-mute); line-height:1.4}
  table.stmt td.item-name{grid-column:1 / -1; order:-1; font-size:16.5px}
  table.stmt td[data-label="비고"]{grid-column:1 / -1}
  body:not(.editing) table.stmt td[data-label="비고"]:has(span:empty){display:none}
  body.editing table.stmt tr.item td[data-edit], body.editing table.stmt td[data-label="비고"] span[data-edit]{display:block; min-height:44px; padding:4px 6px}
  tr.addrow{display:block}
  tr.addrow td{display:block}
  .sum{max-width:none; min-width:0}
  .receiver .line{width:120px}
}

@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }

/* ---------- 인쇄 (A4 한 장) ---------- */
@media print{
  @page{ size:A4; margin:13mm; }
  body{padding:0; background:var(--paper); font-size:11.5pt; line-height:1.5; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .sheet{max-width:none; border:0; border-top:2.5pt solid var(--seal); box-shadow:none; padding:0; padding-top:5mm}
  .toolbar,.toast,.rowctl,tr.addrow{display:none !important}
  body.editing [data-edit]{background:transparent; box-shadow:none}
  body.editing td[data-edit]:empty::after, body.editing span[data-edit]:empty::after{content:none}
  .rule-double{margin:12px 0 16px}
  section + section{margin-top:20px}
  .sec-head{margin-bottom:8px}
  .prow dt,.prow dd{padding-top:4px; padding-bottom:4px; min-height:0}
  table.stmt thead th,table.stmt td{padding-top:6px; padding-bottom:6px}
  tr{break-inside:avoid}
  .totals{margin-top:12px}
  .sum-row{padding:5px 0}
  .sum-total{margin-top:8px; padding:9px 16px}
  .receiver{margin-top:22px}
}

/* ================= 일일 일정표 전용 (거래명세서 · 알바비 스타일 위에 덧붙임 — 견본 2026-10-20 모양) ================= */
.doc-title{letter-spacing:.12em; text-indent:.12em; white-space:nowrap}

/* 표제: 푸드벨 옆 사이트 주소 (인장 옆 QR 은 2026-10-24 사장님 요청으로 뺌 — 그림 images/qr-foodbell.png 는 남아 있음) */
.brand-row{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.brand-url{font-size:16px; font-weight:var(--w-medium); color:var(--seal); text-decoration:none; border-bottom:1px solid var(--gold); letter-spacing:.02em}

/* 큰 날짜(요일은 저절로) · 음력 · 장 번호 */
.day{font-family:var(--serif); font-weight:var(--w-bold); font-size:30px; color:var(--ink); margin:0 0 .6rem; letter-spacing:.02em}
.lunar{font-size:.6em; font-weight:var(--w-normal); color:var(--ink); margin-left:.4em; white-space:nowrap}
.pageno{font-size:.6em; font-weight:var(--w-medium); color:var(--ink-mute); margin-left:.6em}
.pageno:empty{display:none}
/* 사장님 한 줄 — '4건 · 금액 합계 1,264,000원 · 금액 빠진 줄 1'. 화면에서만 — 사진 · 인쇄 · 직원 화면 · 복사 글에는 없다 (2026-10-24 검토 반영) */
.day-stats{font-size:14.5px; color:var(--ink-mute); margin:-.3rem 0 .6rem}
.day-stats:empty{display:none}
@media print{ .day-stats{display:none} }

/* 순번 · 전달 메모 — 비어 있으면 보기 · 사진 · 인쇄에서 숨긴다 */
.order{display:flex; gap:.8rem; align-items:baseline; padding:.45rem .8rem; margin:0 0 .6rem; border-left:3px solid var(--gold); background:var(--band)}
.order b{white-space:nowrap; color:var(--gold-deep); font-weight:var(--w-bold)}
.order span{flex:1}
body:not(.editing) .order:has(span:empty){display:none}
.memo{display:flex; gap:.8rem; align-items:baseline; padding:.55rem .8rem; margin:0 0 1rem;
  background:rgba(110,30,43,.05); border-left:3px solid var(--seal)}
.memo b{white-space:nowrap; color:var(--seal); font-weight:var(--w-bold)}
.memo span{flex:1}
body:not(.editing) .memo:has(span:empty){display:none}

/* 표: 칸 하나에 두세 줄 — 위(굵게) + 아래 작게 */
table.stmt.day-table{table-layout:fixed}
table.stmt.day-table thead th{white-space:normal; word-break:keep-all}   /* 좁은 칸의 머리줄은 낱말 사이에서 두 줄로 — 넘치면 사진에서 잘린다 */
table.stmt.day-table td{vertical-align:top; overflow-wrap:anywhere}
table.stmt.day-table .sub{display:block; font-size:.86em; color:var(--ink); font-weight:var(--w-medium)}   /* 장소 · 연락처 · 팀장 전화 — 큰 글씨와 같은 톤 (사장님 2026-10-21) */
table.stmt.day-table .tel1{white-space:nowrap}   /* 전화번호 하나는 한 줄로 — 번호 둘이면 사이에서 줄바꿈 (telsWrapped) */
/* 보기에서만 번호 → 전화 · 장소 → 지도 (사장님 2026-10-21 저녁). 화면에서만 옅은 밑줄 — 직원 사진(카드, 글자만) · 인쇄는 전과 같은 글자 */
table.stmt.day-table a.tel1, table.stmt.day-table a.map1{color:inherit; text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:3px}
@media print{ table.stmt.day-table a.tel1, table.stmt.day-table a.map1{text-decoration:none} }
table.stmt.day-table [data-f="memo"]{white-space:pre-line}   /* 붙여넣은 주문 글은 줄을 바꿔 그대로 (문자 붙여넣기) */
/* 장례 칸 접기 — 편집 중 여섯 칸(상조팀장 · 팀장 전화 · 안내 · 장례식장 · 발인 · 화장)이 다 비면 '장례 칸 펼치기' 단추만 (2026-10-24 검토 반영) */
body.editing table.stmt.day-table td.meet.folded > :not(.btn-open){display:none !important}
table.stmt.day-table td.when b, table.stmt.day-table td.crew b, table.stmt.day-table td.meet b{display:block; font-weight:var(--w-bold)}
table.stmt.day-table td.crew{word-break:keep-all}   /* 담당 직원 이름은 이름 사이(' · ')에서만 줄바꿈 — 인쇄에서 '가짜 / 사' 처럼 이름이 갈렸다 (2026-10-28) */
table.stmt.day-table td.work .amt{display:block; white-space:nowrap; font-size:.86em; color:var(--seal)}
table.stmt.day-table .amt:empty{display:none}
/* 단위 없는 단가('250') 알림 — 화면에서만 보이고 직원 사진(카드 — rowsData 가 뺀다) · 인쇄에는 안 나간다 (2026-10-21) */
table.stmt.day-table .amt.warn{color:#c62828; font-weight:700; white-space:normal}
@media print{ table.stmt.day-table .amt.warn{display:none !important} }
/* 인원 · 단가 입력 칸은 편집할 때만 (보기에서는 '60명 × 15,000원 = 900,000원' 한 줄) */
table.stmt.day-table .qty{display:none}
body.editing table.stmt.day-table .qty{display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; font-size:.9em; color:var(--ink-mute)}
/* 현지 안내인 전화가 비면 '안내' 글자도 숨긴다 */
body:not(.editing) table.stmt.day-table .guide:has([data-f="guide-tel"]:empty){display:none}
/* 장례식장 · 발인 · 화장 (사장님 2026-10-21) — 발인 · 화장은 한 줄에, 좁으면 둘째 줄로. 비면 '발인' · '화장' 글자도 숨긴다 */
table.stmt.day-table .rite{display:inline-block; white-space:nowrap; margin-right:.7em}
body:not(.editing) table.stmt.day-table .rite:has([data-edit]:empty),
body:not(.editing) table.stmt.day-table .rites:not(:has([data-edit]:not(:empty))){display:none}
/* 연기 · 취소 — 번호 아래 표시(recalc 가 그림), 보기에서는 그 줄 글자를 흐리게. 메모에 '연기'만 적으면 다른 일과 똑같아 보였다 (사장님 10-24 저녁) */
table.stmt.day-table td.c .state{display:block; width:max-content; margin:4px auto 0; padding:0 4px; background:var(--seal); color:var(--paper);
  font-size:12px; font-weight:var(--w-bold); line-height:1.6; border-radius:3px; white-space:nowrap}
body:not(.editing) table.stmt.day-table tr.item[data-state] td:not(.c){opacity:.55}

/* 편집할 때: 두세 줄 칸도 한 칸씩 따로 누르게, 빈 칸에는 무엇을 적을지 흐린 글자로 */
body.editing table.stmt.day-table td > [data-edit],
body.editing table.stmt.day-table td .guide,
body.editing table.stmt.day-table td .rite,
body.editing table.stmt.day-table td .qty [data-edit]{display:flex; align-items:center; margin-bottom:4px; min-width:3em}
body.editing table.stmt.day-table [data-ph]:empty::after,
body.editing .memo [data-ph]:empty::after,
body.editing .order [data-ph]:empty::after,
body.editing .day [data-ph]:empty::after{content:attr(data-ph)}

/* ---------- 직원 사진 = 휴대폰 카드 묶음 (2026-10-24 검토 반영, 설계 2절) ----------
   화면 밖(.shot-cards, 540px)에 직원 화면(today.html)과 같은 카드를 새로 그려 html2canvas 로 2배로 찍는다.
   표 사진은 휴대폰에서 글자가 작아 확대해야 읽혔다. 사진에 찍히는 글자라 ::before 이름표 · tabular-nums 를 쓰지 않는다.
   장마다 다른 장의 카드 · 첫 장에만 있는 부분은 data-shot-hide 로 잠깐 숨긴다 */
.shot-cards{position:absolute; left:-9999px; top:0; width:540px; padding:16px; background:var(--cream); color:var(--ink);
  font-family:var(--sans); font-weight:var(--w-normal); font-size:17px; line-height:1.6}
.shot-cards [data-shot-hide]{display:none !important}
.shot-cards .shot-title{margin:0 0 2px; font-size:14px; font-weight:var(--w-medium); color:var(--ink-mute); letter-spacing:.04em}
.shot-cards .shot-day{margin:0; font-family:var(--serif); font-weight:var(--w-bold); font-size:22px; line-height:1.4}
.shot-cards .shot-day .lunar, .shot-cards .shot-day .pageno{font-family:var(--sans); font-size:14px; font-weight:var(--w-medium); color:var(--ink-mute); margin-left:8px}
.shot-cards .shot-order, .shot-cards .shot-memo{margin:8px 0 0; padding:8px 12px; background:var(--band); border-left:3px solid var(--gold); font-size:15px; overflow-wrap:anywhere}
.shot-cards .shot-memo{border-left-color:var(--seal)}
.shot-cards .shot-stamp{margin:6px 0 0; font-size:13px; color:var(--ink-mute)}
.shot-cards article.card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:12px}
.shot-cards .card .head{margin:0; font-weight:var(--w-bold); overflow-wrap:anywhere}
.shot-cards .card .line{display:flex; gap:10px; margin:8px 0 0; min-width:0}
.shot-cards .card .lab{flex:none; width:3.2em; font-size:14px; color:var(--ink-mute)}
.shot-cards .card .txt{flex:1; min-width:0; word-break:keep-all; overflow-wrap:anywhere}
.shot-cards .card .txt.memo{white-space:pre-line}
.shot-cards .card .head .state{display:inline-block; margin-right:8px; padding:0 8px; background:var(--seal); color:var(--paper); border-radius:4px; font-size:15px}
.shot-cards article.card.off .line{opacity:.55}   /* 연기 · 취소한 일 — 머리의 표시만 진하게 */
.shot-cards .shot-foot{margin-top:16px; text-align:center; font-size:14px; color:var(--ink-mute)}
.shot-cards .shot-foot p{margin:4px 0 0}

@media (max-width:699px){
  .doc-title{font-size:21px; letter-spacing:.06em; text-indent:.06em}
}
/* 휴대폰: 줄마다 카드 — 번호 · 담당 직원 · 차량 / 시간 · 장소 · 연락처 / 행사 · 인원 · 금액 / 상조팀장 · 현지 안내인 / 메모 */
@media (max-width:620px){
  .day{font-size:24px}
  table.stmt.day-table, table.stmt.day-table tbody{display:block}
  table.stmt.day-table tr.item{display:grid; grid-template-columns:2.2em minmax(0, 1fr); gap:6px 10px; padding:12px; border-bottom:1px solid var(--line)}
  table.stmt.day-table tr.item td{display:block; border:0; padding:0; min-width:0}
  table.stmt.day-table tr.item td:not(.c){grid-column:1 / -1}
  table.stmt.day-table tr.item td.crew{grid-column:2}
  table.stmt.day-table tr.item td:not(.c):not(.crew)::before{content:attr(data-label); display:block; font-size:14px; font-weight:var(--w-medium); color:var(--ink-mute); line-height:1.4}
  body:not(.editing) table.stmt.day-table td.memo-cell:has(span:empty),
  body:not(.editing) table.stmt.day-table td.meet:has(b:empty):has([data-f="lead-tel"]:empty):has([data-f="guide-tel"]:empty):has([data-f="hall"]:empty):has([data-f="depart"]:empty):has([data-f="cremate"]:empty){display:none}
}
@media print{
  table.stmt.day-table thead{display:table-header-group}   /* 넘치면 다음 장에 표 제목 줄이 다시 나온다 */
  table.stmt.day-table .qty{display:none !important}
  body.editing table.stmt.day-table [data-ph]:empty::after,
  body.editing .memo [data-ph]:empty::after,
  body.editing .order [data-ph]:empty::after,
  body.editing .day [data-ph]:empty::after{content:none}
}

<script type="module">
/* 일일 일정표 — 알바비 지급내역서(staff-pay.html)의 편집 · 저장 · 보내기 틀을 그대로 쓴다.
   다른 점: 한 줄 = 일 하나 / 날짜를 보고 요일 · 음력을 저절로 / 금액 = 인원 × 단가(저절로, 하루 합계 없음)
            / 새 일정표는 내일 날짜 + 지난 일정표의 순번 · 전달 메모 / 사진은 A4 장마다 나눠 여러 장
            / 파일 이름은 일정 날짜만: 2026-10-21 (여러 장이면 _1 · _2 …) */
import { lunarText } from './js/docs/lunar.js?v=1';
import { pageGroups } from './js/docs/paging.js?v=1';
import { readNumber } from './js/docs/amount.js?v=1';
import { parseOrder } from './js/docs/order-text.js?v=4';
import { cardLines, stampText, STAFF_NOTE, STAFF_LIKE, SHOT_W, SHOT_H } from './js/docs/cards.js?v=2';

const SITE = 'https://foodbell.kr/';
const PAGE_URL = 'https://foodbell.kr/daily-schedule.html';
const WEEK = '일월화수목금토';
// 이어받을 일정표가 하나도 없을 때(맨 처음)의 전달 메모 — 사장님 결정 2026-10-20
const FIRST_MEMO = '추모공원(협력업체)은 회사에서 출발 전에 전화 · 화장은 시작 5분 후 전화 · 매장은 발인 5분 전에 팀장에게 전화 · 상주(직접주문)에게는 가게 출발 전에 전화';
const FIELDS = ['staff', 'car', 'leave', 'time', 'place', 'tel', 'work', 'people', 'price', 'lead', 'lead-tel', 'guide-tel', 'hall', 'depart', 'cremate', 'memo'];

const sheet = document.querySelector('.sheet');
const body = document.body;
const each = (list, fn) => Array.prototype.forEach.call(list, fn);
const fmt = (n) => (n || 0).toLocaleString('ko-KR');
const pad2 = (n) => (n < 10 ? '0' : '') + n;
const clean = (s) => (s || '').replace(/\s+/g, ' ').trim();
const el = (tag, cls, txt) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
};
const setText = (k, v) => { const e = sheet.querySelector(`[data-k="${k}"]`); if (e) e.textContent = v; };
const getText = (k) => { const e = sheet.querySelector(`[data-k="${k}"]`); return e ? clean(e.textContent) : ''; };
const field = (tr, f) => { const e = tr.querySelector(`[data-f="${f}"]`); return e ? clean(e.textContent) : ''; };
const dateKR = (d) => `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;

/* 날짜 글자 → Date. 연 · 월 · 일 숫자 셋이 없거나 없는 날(2월 30일)이면 null */
function parseDay(text) {
  const m = (text || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3] ? d : null;
}
function ymd() {
  const d = parseDay(getText('date')) || new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
const fileBase = () => ymd();   // 파일 이름은 날짜만 (사장님 2026-10-21)
/* 목록 · 공유 제목: '2026년 10월 21일 (수)' — 요일을 못 구하면 적힌 그대로 */
const label = () => [getText('date'), getText('dow')].filter(Boolean).join(' ');
const filled = (tr) => FIELDS.some((f) => field(tr, f));

/* ---------- 줄 번호 · 요일 · 음력 · 금액 ---------- */
function recalc() {
  const d = parseDay(getText('date'));
  setText('dow', d ? `(${WEEK[d.getDay()]})` : '');
  setText('lunar', d ? lunarText(d) : '');
  let count = 0, sum = 0, missing = 0;   // 사장님 한 줄: 건수 · 금액 합계(곱셈 + 단가만) · 단위 없는 줄 수
  let active = 0;
  const held = { 연기: 0, 취소: 0 };      // 연기 · 취소한 줄은 건수 · 합계 · 금액 빠진 줄에서 뺀다 (사장님 10-24 저녁)
  each(sheet.querySelectorAll('tr.item'), (tr, i) => {
    const state = tr.dataset.state || '';
    const no = tr.querySelector('[data-k="no"]');
    if (no) { no.textContent = String(i + 1); if (state) no.append(el('span', 'state', state)); }
    const people = readNumber(field(tr, 'people'));     // 애매하면(범위 · 숫자 둘) null → 곱하지 않고 단가만
    // 단위(만 · 천 · 원) 없이 숫자만('250')이면 25만인지 250원인지 모른다 — 금액을 만들지 않고 단위를 적으라고 알린다.
    // 사장님이 '250' 을 25만 뜻으로 쳤는데 250원으로 직원 사진에 나갔다 (사장님 결정 2026-10-21)
    // 천 단위 쉼표가 제대로 찍힌 숫자('350,000')는 원이 분명하다 — 사장님이 그렇게 쳤는데 사진에 금액이 빠졌다 (2026-10-21)
    const priceText = field(tr, 'price');
    const bare = /\d/.test(priceText) && !/[만천원]/.test(priceText) && !/(^|[^\d,])\d{1,3}(?:,\d{3})+(?![\d,])/.test(priceText);
    const price = bare ? null : readNumber(priceText);
    const amt = tr.querySelector('[data-k="amt"]');
    // 둘 다 있으면 곱셈, 단가만 있으면(상 주문 '35만' · 인원이 애매함) 단가만 — 사장님 결정 2026-10-20
    if (amt) {
      amt.classList.toggle('warn', bare);
      amt.textContent = bare ? '단위를 적어 주세요(예: 25만)'
        : people && price ? `${fmt(people)}명 × ${fmt(price)}원 = ${fmt(people * price)}원` : price ? `${fmt(price)}원` : '';
    }
    if (!state) { if (bare) missing++; else if (price) sum += people ? people * price : price; }
    if (filled(tr)) { count++; if (state) held[state] = (held[state] || 0) + 1; else active++; }
  });
  let stats = sheet.querySelector('.day-stats');
  if (!stats) { stats = el('p', 'day-stats'); sheet.querySelector('.day')?.after(stats); }   // 옛 일정표의 저장 HTML 에는 없다
  stats.textContent = count ? `${active}건 · 금액 합계 ${fmt(sum)}원` + (missing ? ` · 금액 빠진 줄 ${missing}` : '')
    + Object.entries(held).filter(([, n]) => n).map(([s, n]) => ` · ${s} ${n}`).join('') : '';
  return count;
}

/* 메모 칸의 줄들 — 붙여넣은 주문 글의 줄바꿈은 그대로, 빈 줄은 뺀다 */
const memoLines = (tr) => (tr.querySelector('[data-f="memo"]')?.textContent || '').split('\n').map(clean).filter(Boolean);

/* 채운 줄만, 번호는 일정표 그대로(빈 줄을 건너도 사진 · 직원 화면과 같은 번호). 금액에 '단위를 적어 주세요' 는 안 넣는다 */
function rowsData() {
  recalc();
  const rows = [];
  each(sheet.querySelectorAll('tr.item'), (tr, i) => {
    if (!filled(tr)) return;
    rows.push({
      no: i + 1, staff: field(tr, 'staff'), car: field(tr, 'car'), leave: field(tr, 'leave'), time: field(tr, 'time'),
      place: field(tr, 'place'), tel: field(tr, 'tel'), work: field(tr, 'work'),
      amt: clean(tr.querySelector('[data-k="amt"]:not(.warn)')?.textContent),
      lead: field(tr, 'lead'), leadTel: field(tr, 'lead-tel'), guideTel: field(tr, 'guide-tel'), hall: field(tr, 'hall'),
      depart: field(tr, 'depart'), cremate: field(tr, 'cremate'), memo: memoLines(tr).join('\n'),
      state: tr.dataset.state || '',   // 연기 · 취소 — 사진 카드 · 직원 화면이 머리에 표시 (사장님 10-24 저녁)
    });
  });
  return rows;
}

/* ---------- 문자 · 카톡용 요약 (복사 · 옵시디언 사본) ---------- */
function buildText() {
  recalc();
  const L = ['[푸드벨 일일 일정표]', [label(), getText('lunar')].filter(Boolean).join(' · ')];
  if (getText('order')) L.push('순번: ' + getText('order'));
  if (getText('memo')) L.push('전달 메모: ' + getText('memo'));
  L.push('', '[일정]');
  each(sheet.querySelectorAll('tr.item'), (tr, i) => {
    if (!filled(tr)) return;
    const where = [field(tr, 'time'), field(tr, 'place'), field(tr, 'tel')].filter(Boolean).join(' ');
    const amtEl = tr.querySelector('[data-k="amt"]:not(.warn)');   // '단위를 적어 주세요' 는 요약 글에 넣지 않는다
    const what = [field(tr, 'work'), clean(amtEl?.textContent)].filter(Boolean).join(' ');
    const crew = [field(tr, 'staff'), field(tr, 'car')].filter(Boolean).join(' · ');
    const leave = field(tr, 'leave') ? '출발 ' + field(tr, 'leave') : '';
    const lead = [[field(tr, 'lead'), field(tr, 'lead-tel')].filter(Boolean).join(' '),
      field(tr, 'guide-tel') ? '안내 ' + field(tr, 'guide-tel') : '', field(tr, 'hall'),
      field(tr, 'depart') ? '발인 ' + field(tr, 'depart') : '', field(tr, 'cremate') ? '화장 ' + field(tr, 'cremate') : ''].filter(Boolean).join(' · ');
    const head = [where, what].filter(Boolean).join(' — ');
    // 여러 줄 메모(붙여넣은 주문 글)는 줄바꿈을 살려 다음 줄부터 세 칸 들여 쓴다 (2026-10-24 검토 반영)
    const memo = memoLines(tr);
    const held = tr.dataset.state ? `[${tr.dataset.state}] ` : '';   // 연기 · 취소 (사장님 10-24 저녁)
    L.push(`${i + 1}. ` + held + [head, crew, leave, lead, memo.length === 1 ? memo[0] : ''].filter(Boolean).join(' / '));
    if (memo.length > 1) memo.forEach((m) => L.push('   ' + m));
  });
  L.push('', SITE);
  return L.join('\n');
}

/* ---------- 저장 / 복원 : 문서면 전체 HTML (줄 추가 · 삭제까지) ---------- */
function serialize() {
  const c = sheet.cloneNode(true);
  each(c.querySelectorAll('.rowctl, tr.addrow, .btn-open'), (n) => n.remove());
  each(c.querySelectorAll('td.meet.folded'), (n) => n.classList.remove('folded'));
  each(c.querySelectorAll('.day-stats'), (n) => { n.textContent = ''; });   // 사장님 한 줄은 그릴 때마다 계산 — 저장 HTML 에는 없다
  each(c.querySelectorAll('[contenteditable]'), (n) => n.removeAttribute('contenteditable'));
  each(c.querySelectorAll('[data-shot-hide]'), (n) => n.removeAttribute('data-shot-hide'));
  telsPlain(c);
  placesPlain(c);
  return c.innerHTML;
}
/* 저장은 공통 부품(js/docs/doc-page.js)이 웹 저장소로 한다 — 이 화면은 "바뀌었다"고만 알린다 */
function save() { const D = window.FoodbellDoc; if (D && D.onSave) D.onSave(); }

/* ---------- 편집 모드: 줄 삭제 · 줄 추가 버튼 ---------- */
const ROW_HTML = sheet.querySelector('tr.item').innerHTML;
function addControls() {
  const tb = sheet.querySelector('table.stmt tbody');
  each(tb.querySelectorAll('tr.item'), (tr) => {
    if (tr.querySelector('.rowctl')) return;
    const box = el('span', 'rowctl');
    // 연기 · 취소 — 누르면 켜지고 다시 누르면 풀린다, 둘 중 하나만 (사장님 10-24 저녁)
    const marks = ['연기', '취소'].map((s) => {
      const b = el('button', 'btn-mini btn-state', s); b.type = 'button'; b.dataset.set = s;
      b.setAttribute('aria-pressed', String(tr.dataset.state === s));
      return b;
    });
    const p = el('button', 'btn-mini btn-paste', '문자 붙여넣기'); p.type = 'button';
    const d = el('button', 'btn-mini btn-del', '✕ 줄 삭제'); d.type = 'button';
    box.append(...marks, p);
    // 연락처에서 고르기 — 휴대폰 연락처 고르기 창이 있는 브라우저(안드로이드 크롬)에서만 단추가 보인다 (사장님 2026-10-30, 갤럭시)
    if (hasContacts()) { const c = el('button', 'btn-mini btn-contacts', '연락처에서'); c.type = 'button'; box.append(c); }
    box.append(d);
    tr.querySelector('td.memo-cell').appendChild(box);
  });
  if (!tb.querySelector('tr.addrow')) {
    const ar = el('tr', 'addrow'), td = el('td');
    td.colSpan = 6;
    const ab = el('button', 'btn-mini', '＋ 줄 추가 (일 하나)'); ab.type = 'button';
    td.appendChild(ab); ar.appendChild(td); tb.appendChild(ar);
  }
}
function removeControls() {
  each(sheet.querySelectorAll('.rowctl, tr.addrow'), (n) => n.remove());
  each(sheet.querySelectorAll('td.meet'), unfoldMeet);
}
/* 장례 칸 접기 (2026-10-24 검토 반영) — 편집을 시작할 때와 줄을 새로 더할 때만 접는다. 펼친 줄은 그 편집 동안 펼쳐진 채로 둔다.
   하나라도 적혀 있으면(문자 붙여넣기로 채워진 것 포함) 펼친다. 접힘 표시 · 단추는 저장 HTML 에 넣지 않는다 */
const MEET = ['lead', 'lead-tel', 'guide-tel', 'hall', 'depart', 'cremate'];
const meetEmpty = (tr) => MEET.every((f) => !field(tr, f));
function unfoldMeet(td) { td.classList.remove('folded'); td.querySelector('.btn-open')?.remove(); }
function foldMeet(tr) {
  const td = tr.querySelector('td.meet');
  if (!td) return;
  if (!meetEmpty(tr)) { unfoldMeet(td); return; }
  td.classList.add('folded');
  if (!td.querySelector('.btn-open')) { const b = el('button', 'btn-mini btn-open', '장례 칸 펼치기'); b.type = 'button'; td.appendChild(b); }
}
function setCE(on) { each(sheet.querySelectorAll('[data-edit]'), (e) => { e.contentEditable = on ? 'true' : 'false'; }); }
/* 전화번호 칸: 보기에서만 번호마다 한 덩어리(.tel1)로 묶어 번호 사이에서만 줄이 바뀌게 — 크롬은 하이픈 뒤에서도 끊는다.
   그 덩어리는 누르면 전화가 걸리는 링크(사장님 2026-10-21 저녁). 편집 · 저장은 글자 그대로 (최종 검토 I4) */
const TEL = /(\d{2,4}-\d{3,4}-\d{4})/;
function telsPlain(root) { each(root.querySelectorAll('[data-f$="tel"]'), (n) => { if (n.children.length) n.textContent = n.textContent; }); }
function telLink(p) {
  const a = el('a', 'tel1', p);
  a.href = 'tel:' + p.replace(/-/g, '');
  return a;
}
function telsWrapped() {
  each(sheet.querySelectorAll('[data-f$="tel"]'), (n) => {
    if (n.children.length || !TEL.test(n.textContent)) return;
    n.replaceChildren(...n.textContent.split(TEL).map((p, i) => (i % 2 ? telLink(p) : document.createTextNode(p))));
  });
}
/* 장소 칸: 보기에서만 누르면 네이버 지도(휴대폰용 주소, 새 창) — today.html 의 [지도]와 같은 주소. 편집 · 저장은 글자 그대로
   (사장님 2026-10-21 저녁 — 일정표 화면에서 장소를 눌러도 지도가 안 나왔다) */
const MAP = 'https://m.map.naver.com/search2/search.naver?query=';
function placesPlain(root) { each(root.querySelectorAll('[data-f="place"]'), (n) => { if (n.children.length) n.textContent = n.textContent; }); }
function placesLinked() {
  each(sheet.querySelectorAll('[data-f="place"]'), (n) => {
    if (n.children.length || !clean(n.textContent)) return;
    const a = el('a', 'map1', n.textContent);
    a.href = MAP + encodeURIComponent(clean(n.textContent));
    a.target = '_blank';
    a.rel = 'noopener';
    n.replaceChildren(a);
  });
}
/* 숫자만 쓴 번호 → 작대기 넣은 꼴, 전화번호 모양이 아니면 null — 휴대폰 · 지역번호(02 · 031 …) · 070 · 대표번호(1588 …).
   call.html · today.html 에도 같은 것이 있다 */
function telShape(d) {
  const m = d.match(/^(02|0\d{2})(\d{3,4})(\d{4})$/) || d.match(/^(1[5-9]\d{2})(\d{4})$/);
  return m ? m.slice(1).join('-') : null;
}
/* 전화번호 칸에 숫자만 친 번호에 작대기 — 01012345678 → 010-1234-5678 (칸을 떠날 때, 사장님 2026-10-21).
   날짜 같은 숫자 · 이미 작대기가 있는 번호 · 번호 앞뒤 글자는 그대로 */
const dashTels = (s) => s.replace(/(^|[^\d-])(\d{8,11})(?![\d-])/g, (all, pre, d) => (telShape(d) ? pre + telShape(d) : all));

const btnEdit = document.getElementById('btn-edit');
function setEditing(on) {
  body.classList.toggle('editing', on);
  btnEdit.setAttribute('aria-pressed', String(on));
  btnEdit.textContent = on ? '편집 완료' : '편집';
  if (on) {
    telsPlain(sheet); placesPlain(sheet); addControls(); setCE(true);
    each(sheet.querySelectorAll('tr.item'), foldMeet);
  } else { removeControls(); setCE(false); telsWrapped(); placesLinked(); save(); }
}

/* ---------- 입력 처리 (새로 추가한 줄까지) ---------- */
sheet.addEventListener('input', (e) => {
  const t = e.target.closest?.('[data-edit]');
  if (!t) return;
  recalc();
  save();
});
sheet.addEventListener('focusout', (e) => {
  const t = e.target.closest?.('[data-edit]');
  if (!t) return;
  // 글자를 다 지운 칸에는 브라우저가 <br> 을 남긴다 — 그러면 :empty 가 안 맞아 '발인' · '안내' 이름표가 빈 채로 보인다
  if (!t.textContent.trim()) { if (t.innerHTML) { t.textContent = ''; save(); } return; }
  if (!t.matches('[data-f$="tel"]')) return;
  const v = dashTels(t.textContent);
  if (v !== t.textContent) { t.textContent = v; save(); }
});
sheet.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const t = e.target.closest?.('[data-edit]');
  if (t) { e.preventDefault(); t.blur(); }
});
sheet.addEventListener('click', (e) => {
  const b = e.target.closest?.('button.btn-mini');
  if (!b) return;
  e.preventDefault();
  if (b.classList.contains('btn-open')) {
    const td = b.closest('td.meet');
    unfoldMeet(td);
    td.querySelector('[data-f="lead"]')?.focus();
    return;
  }
  if (b.classList.contains('btn-paste')) {
    pasteRow = b.closest('tr.item');
    pasteText.value = '';
    pasteDlg.showModal();
    pasteText.focus();
    return;
  }
  if (b.classList.contains('btn-contacts')) { pickContacts(b.closest('tr.item')); return; }
  if (b.classList.contains('btn-state')) {
    const tr = b.closest('tr.item');
    if (tr.dataset.state === b.dataset.set) delete tr.dataset.state; else tr.dataset.state = b.dataset.set;
    each(tr.querySelectorAll('.btn-state'), (x) => x.setAttribute('aria-pressed', String(tr.dataset.state === x.dataset.set)));
  } else if (b.classList.contains('btn-del')) {
    // 묻고 지운다 — 다른 서류 다섯 종과 같다 (사장님 10-24, 묻지 않으면 잘못 누른 한 번에 줄이 사라졌다)
    const row = b.closest('tr.item');
    if (row && window.confirm('이 항목을 삭제할까요?')) row.remove();
  } else if (b.closest('tr.addrow')) {
    const tr = el('tr', 'item'); tr.innerHTML = ROW_HTML;
    b.closest('tr.addrow').parentNode.insertBefore(tr, b.closest('tr.addrow'));
    addControls(); setCE(true); foldMeet(tr);
    tr.querySelector('[data-f="staff"]').focus();
  }
  recalc(); save();
});

/* ---------- 문자 붙여넣기 (편집 중, 줄마다) — 카톡 주문 글에서 모양이 분명한 것만 그 줄의 빈 칸에 (js/docs/order-text.js).
   이미 적힌 칸은 그대로, 원문은 메모 끝에 그대로 (사장님 결정 2026-10-20) ---------- */
const pasteDlg = document.getElementById('paste-dlg');
const pasteText = document.getElementById('paste-text');
let pasteRow = null;
function pasteOrder(tr, text) {
  const o = parseOrder(text);
  const put = (f, v) => { const e = tr.querySelector(`[data-f="${f}"]`); if (e && v && !clean(e.textContent)) e.textContent = v; };
  put('tel', o.tel.join(', '));
  put('time', o.time);
  put('depart', o.depart);
  put('cremate', o.cremate);
  put('price', o.price ? `${fmt(o.price)}원` : '');
  const m = tr.querySelector('[data-f="memo"]');
  if (m && o.memo) m.textContent = [m.textContent.trim(), o.memo].filter(Boolean).join('\n');
  foldMeet(tr);                                   // 발인 · 화장이 채워졌으면 접힌 장례 칸을 편다
  recalc(); save();
}
document.getElementById('paste-ok').addEventListener('click', () => {
  if (pasteRow && pasteRow.isConnected) pasteOrder(pasteRow, pasteText.value);
  pasteDlg.close();
});
document.getElementById('paste-cancel').addEventListener('click', () => pasteDlg.close());

/* ---------- 연락처에서 고르기 (편집 중, 줄마다) — 안드로이드 크롬의 연락처 고르기 창(Contact Picker). 고른 사람마다 '이름 010-…' 를
   연락처 칸 끝에 더한다(이미 적힌 것이 있으면 ' / ' 로 이어서). 번호는 우리 쪽에 저장하지 않는다 — 고른 것만 칸에 들어간다.
   아이폰 · PC 크롬 · 카톡 안 브라우저에는 이 창이 없어 단추도 없다 (사장님 2026-10-30, 갤럭시) ---------- */
const hasContacts = () => !!(navigator.contacts && navigator.contacts.select);
const localTel = (t) => dashTels(String(t || '').replace(/^\+82[\s-]?/, '0').replace(/\D/g, ''));   // '+82 10-…' → '010-…'
async function pickContacts(tr) {
  let list;
  // 한 명씩 — 여러 명 고르기(multiple)로 하면 이름을 눌러도 체크만 되고 위의 '완료' 를 눌러야 넘어와서, 사장님 폰에서 '이동이 안 된다' 로 보였다(10-30).
  // 한 명 고르기면 이름을 누르는 순간 바로 들어온다. 두 사람이면 단추를 한 번 더 누른다(' / ' 로 이어짐)
  try { list = await navigator.contacts.select(['name', 'tel'], { multiple: false }); }
  catch (err) { toast('연락처를 가져오지 못했습니다 (' + ((err && err.name) || '알 수 없음') + ')'); return; }   // 권한을 안 줬거나 창을 못 연 경우
  // 멈춘 자리마다 알림 — 사장님 폰에서 번호가 안 들어갔는데 어디서 멈췄는지 알 수 없었다 (2026-10-30)
  if (!list || !list.length) { toast('고른 연락처가 없습니다'); return; }   // 고르기를 취소하면 빈 목록이 온다
  // 번호 없는 사람은 건너뛴다 — 이름만 들어가면 전화 단추가 안 생긴다
  const parts = list.map((c) => { const t = localTel((c.tel || [])[0]); return t ? [clean((c.name || [])[0]), t].filter(Boolean).join(' ') : ''; }).filter(Boolean);
  if (!parts.length) { toast('고른 연락처에 쓸 수 있는 전화번호가 없습니다 (받은 값: ' + JSON.stringify(list.map((c) => c.tel)) + ')', 8000); return; }
  if (!tr || !tr.isConnected) { toast('이 줄이 없어졌습니다'); return; }
  const e = tr.querySelector('[data-f="tel"]');
  e.textContent = [clean(e.textContent), ...parts].filter(Boolean).join(' / ');
  recalc(); save();
  toast(parts.length + '명의 번호를 연락처 칸에 넣었습니다');
}

/* ---------- 공용: 토스트 / 복사 / 다운로드 ---------- */
const toastEl = document.getElementById('toast');
let toastT;
function toast(msg, ms) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; }, ms || 3200);
}
/* 사진을 클립보드에 넣는다 — PC 카카오톡 대화창에서 Ctrl+V 로 바로 붙는다 */
function copyImage(blob) {
  if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)) return Promise.resolve(false);
  return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(() => true, () => false);
}
function copyFallback(text) {
  const ta = el('textarea'); ta.value = text;
  ta.style.position = 'fixed'; ta.style.top = '-9999px';
  body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch { window.prompt('아래 내용을 복사하세요', text); }
  body.removeChild(ta);
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(() => copyFallback(text));
  copyFallback(text); return Promise.resolve();
}
function downloadBlob(blob, name) {
  const a = el('a'); a.href = URL.createObjectURL(blob); a.download = name;
  body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- 직원 사진(PNG) = 휴대폰 카드 묶음, 9:16 장마다 나눠 여러 장 (2026-10-24 검토 반영, 설계 2절) ----------
   화면 밖 .shot-cards(540px)에 카드를 새로 그려(js/docs/cards.js) html2canvas 로 2배(1080px)로 찍는다 — 표 사진은 휴대폰에서
   글자가 작아 확대해야 읽혔다. 카드 하나는 두 장에 안 갈라진다(pageGroups). 상호 · QR · 인장은 넣지 않는다.
   첫 장에만 제목 · 순번 · 전달 메모 · 보냄 표시, 장마다 맨 아래 두 줄(STAFF_NOTE · STAFF_LIKE) */
const CARD_GAP = 12;                                           // article.card 의 margin-top
const sentCount = () => parseInt(getText('sent'), 10) || 0;   // '직원에게 보내기' 횟수 (옛 일정표에는 칸이 없다 → 0)
function setSent(n) {
  if (!sheet.querySelector('[data-k="sent"]')) { const s = el('span'); s.dataset.k = 'sent'; s.hidden = true; sheet.querySelector('.day')?.after(s); }
  setText('sent', String(n)); save();
}
function buildCards(stamp) {
  document.getElementById('shot-cards')?.remove();
  const box = el('div', 'shot-cards'); box.id = 'shot-cards'; box.setAttribute('aria-hidden', 'true');
  const head = el('div', 'shot-head');
  head.append(el('p', 'shot-title', '푸드벨 일일 일정표'));
  const day = el('p', 'shot-day'); day.append(el('span', '', label()));
  if (getText('lunar')) day.append(el('span', 'lunar', getText('lunar')));
  day.append(el('span', 'pageno', ''));
  head.append(day);
  if (getText('order')) head.append(el('p', 'shot-order', '순번: ' + getText('order')));
  if (getText('memo')) head.append(el('p', 'shot-memo', '전달 메모: ' + getText('memo')));
  head.append(el('p', 'shot-stamp', stamp));
  box.append(head);
  rowsData().forEach((r) => {
    const card = el('article', r.state ? 'card off' : 'card'); card.dataset.no = String(r.no);
    cardLines(r).forEach((ln, i) => {
      const p = el('p', i ? 'line' : 'head');
      if (ln.state) p.append(el('span', 'state', ln.state));   // 연기 · 취소 — 머리 맨 앞 (사장님 10-24 저녁)
      if (ln.lab) p.append(el('span', 'lab', ln.lab));
      p.append(el('span', ln.lab === '메모' ? 'txt memo' : 'txt', ln.text));
      card.append(p);
    });
    box.append(card);
  });
  const foot = el('div', 'shot-foot');
  foot.append(el('p', '', STAFF_NOTE), el('p', '', STAFF_LIKE));
  box.append(foot);
  body.append(box);
  return box;
}
function shoot(box) {
  if (typeof html2canvas !== 'function') return Promise.resolve(null);
  return html2canvas(box, { backgroundColor: '#F7F2E9', scale: 2, useCORS: true, logging: false, windowWidth: SHOT_W, width: SHOT_W })
    .then((canvas) => new Promise((res) => canvas.toBlob((b) => res(b), 'image/png'))).catch(() => null);
}
async function renderPages(stamp) {
  await (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve());
  const box = buildCards(stamp);
  try {
    const cards = [...box.querySelectorAll('article.card')];
    const firstOnly = [...box.querySelectorAll('.shot-title, .shot-order, .shot-memo, .shot-stamp')];
    const no = box.querySelector('.pageno');
    const hide = (list, on) => list.forEach((e) => e.toggleAttribute('data-shot-hide', on));
    no.textContent = '1/1';                                    // 장 번호 자리까지 재어 둔다
    const heights = cards.map((c) => c.offsetHeight + CARD_GAP);
    hide(cards, true);
    const first = box.offsetHeight;                            // 첫 장: 제목 · 날짜 · 순번 · 메모 · 보냄 · 아래 두 줄
    hide(firstOnly, true);
    const next = box.offsetHeight;                             // 다음 장: 날짜 · 아래 두 줄
    hide(firstOnly, false); hide(cards, false);
    const groups = pageGroups(heights, SHOT_H - first, SHOT_H - next);
    const out = [];
    for (let g = 0; g < groups.length; g++) {
      cards.forEach((c, i) => c.toggleAttribute('data-shot-hide', !groups[g].includes(i)));
      hide(firstOnly, g > 0);
      no.textContent = groups.length > 1 ? `${g + 1}/${groups.length}` : '';
      const blob = await shoot(box);
      if (!blob) return [];
      out.push({ blob, name: groups.length > 1 ? `${fileBase()}_${g + 1}.png` : `${fileBase()}.png` });
    }
    return out;
  } finally { box.remove(); }
}

/* 인쇄 · PDF: 저장 창에 뜨는 파일 이름이 문서 제목을 따르므로, 그동안만 제목을 날짜 이름으로 바꾼다 */
const pageTitle = document.title;
window.addEventListener('afterprint', () => { document.title = pageTitle; });
document.getElementById('btn-print').addEventListener('click', () => {
  setEditing(false);
  document.title = fileBase();
  window.print();
  setTimeout(() => { document.title = pageTitle; }, 1500);
});

document.getElementById('btn-copy').addEventListener('click', function () {
  const btn = this, old = btn.textContent;
  copyText(buildText()).then(() => {
    btn.textContent = '복사됨'; setTimeout(() => { btn.textContent = old; }, 1400);
  });
});

document.getElementById('btn-send').addEventListener('click', function () {
  if (!recalc() && !window.confirm('일정을 아직 안 넣으셨습니다. 그래도 보낼까요?')) return;
  // 단위 없는 단가('250')는 사진에서 금액이 빠진 채 나간다 — 보내기 전에 한 번 묻는다 (2026-10-24 검토 반영, 10-21 실제로 난 일)
  // 연기 · 취소한 줄은 묻지 않는다 (사장님 10-24 저녁)
  const noAmt = Array.prototype.map.call(sheet.querySelectorAll('tr.item'), (tr, i) => (tr.querySelector('.amt.warn') && !tr.dataset.state ? i + 1 : 0)).filter(Boolean);
  if (noAmt.length && !window.confirm(`${noAmt.join(' · ')}번 줄 금액이 비어 있습니다(단위 없음). 그래도 보낼까요?`)) return;
  const btn = this, old = btn.textContent;
  btn.disabled = true; btn.textContent = '준비 중…';
  setEditing(false);
  const title = `푸드벨 일일 일정표 (${label()})`;
  const text = `${title}\n${PAGE_URL}`;
  const done = () => { btn.disabled = false; btn.textContent = old; };
  // 이번 보내기의 차수를 사진에 찍고(N+1), 실제로 나간 뒤에 세어 둔다 — 공유창을 취소하면 안 센다 (2026-10-24 검토 반영)
  const stamp = stampText(sentCount() + 1, new Date());
  const bump = () => setSent(sentCount() + 1);
  renderPages(stamp).then((pages) => {
    const files = pages.map((p) => new File([p.blob], p.name, { type: 'image/png' }));
    function fallback() {
      if (!pages.length) { copyText(buildText()); toast('요약 문구를 복사했습니다. 이미지가 필요하면 ‘인쇄 · PDF’를 이용하세요.'); return done(); }
      pages.forEach((p) => downloadBlob(p.blob, p.name));
      copyImage(pages[0].blob).then((ok) => {
        const many = pages.length > 1 ? ` (사진 ${pages.length}장 — 첫 장만 복사됨, 모두 다운로드 폴더에)` : ` (다운로드 폴더에도 ${pages[0].name} 저장됨)`;
        if (ok) toast('일정표 사진을 복사했습니다. 직원 단톡방 대화창에서 Ctrl+V 로 붙여넣으세요.' + many, 8000);
        else { copyText(buildText()); toast(`사진 ${pages.length}장을 저장하고 요약 문구를 복사했습니다. 카톡으로 단톡방에 보내세요.`); }
        bump();
        done();
      });
    }
    // 휴대폰: 공유창(카톡 단톡방 고르기)으로 사진(장마다)을 넘긴다. PC 공유 창에는 카카오톡 PC 가 안 나와서 쓰지 않는다
    if (files.length && matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files })) {
      navigator.share({ files, title, text }).then(() => { bump(); done(); }, (e) => {
        if (e && e.name === 'AbortError') return done();
        fallback();
      });
      return;
    }
    fallback();
  });
});

document.getElementById('btn-save-file').addEventListener('click', function () {
  if (!recalc() && !window.confirm('일정을 아직 안 넣으셨습니다. 그래도 저장할까요?')) return;
  const btn = this, old = btn.textContent;
  btn.disabled = true; btn.textContent = '저장 중…';
  setEditing(false);
  renderPages(stampText(sentCount(), new Date())).then((pages) => {   // 파일로 저장은 시각만 찍고 차수는 그대로
    btn.disabled = false; btn.textContent = old;
    if (!pages.length) return toast('저장에 실패했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');
    pages.forEach((p) => downloadBlob(p.blob, p.name));
    toast(pages.length > 1 ? `사진 ${pages.length}장으로 저장했습니다 (${pages[0].name} …). 다운로드 폴더에서 확인하세요.`
      : `${pages[0].name} 으로 저장했습니다. (다운로드 폴더에서 확인하세요)`);
  });
});

btnEdit.addEventListener('click', () => { setEditing(!body.classList.contains('editing')); });

/* 새 일정표: 날짜 = 내일, 전달 메모 = 맨 처음 글 (지난 일정표가 있으면 inherit 가 순번 · 메모를 덮는다) */
function fillFresh() {
  const t = new Date();
  t.setDate(t.getDate() + 1);
  setText('date', dateKR(t));
  setText('memo', FIRST_MEMO);
  recalc();
}

/* 웹 저장소 연결 고리 — 공통 부품(js/docs/doc-page.js)이 이것으로 서류를 그리고 · 새로 만들고 · 저장한다.
   목록 구분값은 일정 날짜(요일) */
const FRESH = sheet.innerHTML;
window.FoodbellDoc = {
  kind: 'daily-schedule',
  serialize,
  load(html) {
    sheet.innerHTML = html;
    // 지도 링크 칸(map)은 2026-10-30 뺐다(사장님 — 장소 글자가 이미 지도를 연다). 그 전에 저장된 일정표에 남은 칸은 지운다
    each(sheet.querySelectorAll('[data-f="map"]'), (n) => n.remove());
    recalc();
    if (body.classList.contains('editing')) { addControls(); setCE(true); }   /* 편집 중에 다른 기기 고침이 와도 고칠 수 있게 */
    else { telsWrapped(); placesLinked(); }
  },
  fresh() { sheet.innerHTML = FRESH; fillFresh(); },
  // 가장 최근에 고친 일정표(저장된 화면)에서 순번 · 전달 메모만 이어받는다 — 없으면 맨 처음 글 그대로
  inherit(doc) {
    if (!doc || !doc.html) return;
    const t = document.createElement('template');
    t.innerHTML = doc.html;
    const pick = (k) => clean(t.content.querySelector(`[data-k="${k}"]`)?.textContent);
    setText('order', pick('order'));
    setText('memo', pick('memo'));
  },
  summary() {
    const count = recalc();
    return { label: label(), issue: label(), total: '', count: `${count}건`, text: buildText() };
  },
  // 새 일정표(내일 날짜)와 같은 날짜 일정표가 이미 있으면 그 하나 — rows 는 최근에 고친 순. 공통 부품이 '그래도 새로 만들까요?' 를 묻는다
  // (사장님 10-24 저녁 — 10-21 같은 날 일정표가 넷 생겨 직원 화면에 빈 일정이 먼저 떴다)
  sameDoc(rows) {
    const l = label();
    const hit = (rows || []).find((r) => r.doc && r.doc.label === l);
    return hit ? { id: hit.id, label: l } : null;
  },
  // 직원 게시판 한 장 (today.html — 단톡방 공지의 고정 링크, 사장님 2026-10-21). 사진에 있는 글자만, 채운 줄만 —
  // 번호는 일정표 그대로(사진과 같게). 금액에 '단위를 적어 주세요' 는 안 넣는다. 날짜를 못 읽거나 일이 하나도 없으면 올리지 않는다
  // (null → 칸을 뺌 — 같은 날 빈 일정표가 먼저 골라져 직원 화면에 [전화] · [지도]가 안 보였다, 10-21 저녁)
  // 채운 줄 목록(번호는 일정표 그대로) — 게시판 한 장과 직원 사진(카드)이 같이 쓴다 (2026-10-24 검토 반영)
  rowsData,
  share() {
    if (!parseDay(getText('date'))) return null;
    const rows = rowsData();
    if (!rows.length) return null;
    return { date: ymd(), label: label(), lunar: getText('lunar'), order: getText('order'), memo: getText('memo'), rows };
  },
  editing() { return body.classList.contains('editing'); },
  onSave: null,
};
fillFresh();
