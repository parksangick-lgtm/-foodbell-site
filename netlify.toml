# 넷리파이(Netlify) 배포 설정
# 이 사이트는 빌드가 필요 없는 순수 정적 HTML/CSS/JS 입니다.
# GitHub 저장소를 넷리파이에 연결해 두면, office 브랜치에 push 할 때마다 자동 배포됩니다.
# (사용법은 작업방법.md 의 "넷리파이로 웹에 올리기" 참고)

[build]
  # 저장소 루트를 그대로 게시 (index.html 이 루트에 있음)
  publish = "."
  # 빌드 과정 없음
  command = "echo '정적 사이트 - 빌드 단계 없음'"

# HTML 은 캐시하지 않고 매번 최신 확인 → 배포하면 바로 반영됨
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 이미지는 일주일 캐시.
# 사진을 교체했는데 바로 안 바뀌면 index.html 에서 그 파일 뒤 ?v= 숫자를 1 올리세요.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS / JS 는 하루 캐시 (index.html 의 ?v= 숫자로 갱신 관리)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- PWA (홈 화면에 추가하면 앱처럼 실행) ---

# 서비스 워커는 절대 캐시하지 않음 → 사이트를 고치면 앱에도 바로 반영됨
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 웹앱 매니페스트
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# 앱 아이콘 (거의 안 바뀜 → 일주일 캐시)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
