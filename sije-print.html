<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>시제행사 내역서 인쇄</title>
<link rel="stylesheet" href="css/sije-sheet.css?v=3">
<style>body{margin:0;background:#FFFFFF}</style>
</head>
<body>
<div id="sheet"></div>
<script type="module">
// 인쇄 전용 — window.__SIJE__ = {event, images} 로 받은 행사를 그리기만 한다 (파이어베이스 없음).
// 사무실 PC 의 PDF 프로그램(tools/sije_web/render_pdf.py)이 이 화면을 열어 PDF 로 저장한다.
import { renderSheet, fitToA4 } from './js/sije/sheet-render.js?v=4';

const root = document.getElementById('sheet');
const { event, images = [] } = window.__SIJE__ || {};
if (event) {
  renderSheet(root, event, images, { editable: false });
  await Promise.all([...root.querySelectorAll('img')].map((img) => img.decode().catch(() => {})));
  await document.fonts.ready;
  fitToA4(root);
  if (root.dataset.overflow) document.body.dataset.overflow = '1';
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
