<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #F7F2E9; }
    a { color: #6E1E2B; text-decoration: none; }
    a:hover { color: #8A2836; }
  </style>
</helmet>

<div id="sheet" style="width: 794px; height: 1123px; box-sizing: border-box; padding: 30px 34px 24px; background: #FFFDF8; font-family: 'Noto Sans KR', sans-serif; color: #120C06; display: flex; flex-direction: column; gap: 10px;">

  <!-- ================= 표제 ================= -->
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 40px; letter-spacing: 3px; color: #6E1E2B; line-height: 1.1;">푸드벨</div>
      <div style="font-size: 20px; font-weight: 700; color: #2A2318; margin-top: 2px;">010-5353-3477</div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
        <div style="font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 38px; letter-spacing: 6px; line-height: 1.1;">작업지시서</div>
        <div style="font-size: 14px; color: #8A6C3E; letter-spacing: 6px;">作業 指示書</div>
      </div>
      <svg width="60" height="60" viewBox="0 0 64 64" role="img" aria-label="푸드벨 인장">
        <rect x="1.5" y="1.5" width="61" height="61" rx="4" fill="#6E1E2B"></rect>
        <rect x="5.5" y="5.5" width="53" height="53" rx="2" fill="none" stroke="#FFFDF8" stroke-width="1.2" opacity=".6"></rect>
        <text x="32" y="20" text-anchor="middle" fill="#FFFDF8" font-family="'Gowun Batang',serif" font-weight="700" font-size="15">푸</text>
        <text x="32" y="37.5" text-anchor="middle" fill="#FFFDF8" font-family="'Gowun Batang',serif" font-weight="700" font-size="15">드</text>
        <text x="32" y="55" text-anchor="middle" fill="#FFFDF8" font-family="'Gowun Batang',serif" font-weight="700" font-size="15">벨</text>
      </svg>
    </div>
  </div>

  <div style="border-top: 2px solid #6E1E2B; border-bottom: 1px solid #D3C4A8; height: 3px;"></div>

  <!-- ================= 봉행 개요 ================= -->
  <div style="display: flex; flex-direction: column; gap: 7px;">
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <span style="font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 26px;">봉행 개요</span>
      <span style="font-size: 15px; color: #8A6C3E; letter-spacing: 2px;">奉行 槪要</span>
      <span style="flex-grow: 1; border-bottom: 2px solid #B08D57; max-width: 44px;"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border: 1px solid #D3C4A8;">
      <div style="display: flex; border-bottom: 1px solid #E2D6BF; border-right: 1px solid #E2D6BF;">
        <div style="width: 104px; flex-shrink: 0; background: #F1EADB; padding: 7px 10px; font-size: 18px; font-weight: 600; color: #2A2318;">행사 구분</div>
        <div style="flex-grow: 1; padding: 7px 10px; font-size: 19px;">야외 시제</div>
      </div>
      <div style="display: flex; border-bottom: 1px solid #E2D6BF;">
        <div style="width: 104px; flex-shrink: 0; background: #F1EADB; padding: 7px 10px; font-size: 18px; font-weight: 600; color: #2A2318;">고임 규격</div>
        <div style="flex-grow: 1; padding: 7px 10px; font-size: 19px; font-weight: 700; color: #6E1E2B;">{{tierLabel}}</div>
      </div>
      <div style="display: flex; border-right: 1px solid #E2D6BF;">
        <div style="width: 104px; flex-shrink: 0; background: #F1EADB; padding: 7px 10px; font-size: 18px; font-weight: 600; color: #2A2318;">봉행 일시</div>
        <div style="flex-grow: 1; padding: 7px 10px; font-size: 19px;">&nbsp;</div>
      </div>
      <div style="display: flex;">
        <div style="width: 104px; flex-shrink: 0; background: #F1EADB; padding: 7px 10px; font-size: 18px; font-weight: 600; color: #2A2318;">봉행 장소</div>
        <div style="flex-grow: 1; padding: 7px 10px; font-size: 19px;">&nbsp;</div>
      </div>
    </div>
  </div>

  <!-- ================= 준비 내역 (행사 견적서 표 방식) ================= -->
  <div style="display: flex; flex-direction: column; gap: 7px; flex-grow: 1;">
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <span style="font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 26px;">준비 내역</span>
      <span style="font-size: 15px; color: #8A6C3E; letter-spacing: 2px;">準備 內譯</span>
      <span style="flex-grow: 1; border-bottom: 2px solid #B08D57; max-width: 44px;"></span>
    </div>

    <div style="border: 1px solid #D3C4A8; display: flex; flex-direction: column;">
      <!-- 표 머리 -->
      <div style="display: grid; grid-template-columns: 186px minmax(0, 1fr) 96px; background: #EDE4D3; border-bottom: 1px solid #D3C4A8;">
        <div style="padding: 7px 12px; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 20px; letter-spacing: 1px;">품목</div>
        <div style="padding: 7px 12px; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 20px; letter-spacing: 1px;">세부 구성</div>
        <div style="padding: 7px 12px; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 20px; letter-spacing: 1px; text-align: right;">수량</div>
      </div>

      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <!-- 구분 머리띠 -->
        <div style="background: #F1EADB; border-top: 1px solid #D3C4A8; border-bottom: 1px solid #E2D6BF; padding: 6px 12px; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 21px; color: #4E141E;">{{g.title}}</div>

        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
          <!-- 품목 -->
          <div style="display: grid; grid-template-columns: 186px minmax(0, 1fr) 96px;">
            <div style="padding: 8px 12px; font-size: 21px; font-weight: 600; color: #120C06;">{{r.name}}</div>
            <div style="padding: 9px 12px; font-size: 16px; font-weight: 400; color: #2A2318; line-height: 1.4;">{{r.detail}}</div>
            <div style="padding: 8px 12px; font-size: 21px; font-weight: 700; color: #6E1E2B; text-align: right; white-space: nowrap;">{{r.qty}}</div>
          </div>
          <!-- 그 품목에 더 적는 줄 -->
          <div style="display: grid; grid-template-columns: 186px minmax(0, 1fr) 96px; border-bottom: 1px solid #E2D6BF; background: #FFFDF8;">
            <div style="padding: 13px 12px; border-right: 1px dotted #E2D6BF;"></div>
            <div style="padding: 13px 12px; border-right: 1px dotted #E2D6BF;"></div>
            <div style="padding: 13px 12px;"></div>
          </div>
        </sc-for>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; justify-content: flex-end; font-size: 13px; color: #6B5E48;">푸드벨 · 박상익출장음식</div>

</div>
</x-dc>

<script data-dc-script data-props='{"tier":{"editor":"enum","options":["7치 고임상","1자 고임상"],"default":"7치 고임상","section":"고임 규격"}}'>
class Component extends DCLogic {
  renderVals() {
    var tier = this.props.tier ?? '7치 고임상';
    var isJa = tier === '1자 고임상';

    return {
      tierLabel: tier,

      groups: [
        {
          title: '가. 제수 음식',
          rows: [
            { name: '과실 · 조과', qty: isJa ? '1자' : '7치',
              detail: '대추 · 밤 · 배 · 감 · 사과, 약과 · 산자' },
            { name: '포 · 혜 · 나물', qty: isJa ? '700g' : '500g',
              detail: '북어포, 식혜, 간장, 삼색나물(고사리 · 도라지 · 시금치), 나박김치' },
            { name: '탕 3종', qty: '1식', detail: '육탕 · 소탕 · 어탕' },
            { name: '적 · 전', qty: isJa ? '8개' : '6개',
              detail: '육적 · 계적 · 어적, 육전 · 어전 · 동태전' },
            { name: '반 · 갱 · 면', qty: '1', detail: '메(밥), 탕국, 국수, 시접 일습, 떡(웃기 · 주악), 생수, 청주' }
          ]
        },
        {
          title: '나. 제례 집기',
          rows: [
            { name: '제기 일습', qty: '1식',
              detail: '향로 · 향합 · 촛대 · 모사기 · 퇴주기 · 잔반' }
          ]
        },
        {
          title: '마. 산신제',
          rows: [
            // 수량은 알려주신 바가 없어 비워 둔다. 아래 줄에 손으로 적는다.
            { name: '산신제 제수', qty: '',
              detail: '밤 · 배 · 사과 · 포 · 식혜 · 술' }
          ]
        }
      ]
    };
  }
}
</script>
</body>
</html>
